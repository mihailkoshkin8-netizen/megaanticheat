# =========================================
#  MegaAntiCheat - конфигурация
#  Значения ниже подобраны как разумный баланс между
#  ловлей читеров и минимумом ложных срабатываний.
#  Если стафф жалуется на много ложных варнингов - увеличивайте пороги.
#  Если читеры проходят незамеченными - уменьшайте.
# =========================================

# Право, которое должно быть у игрока (или через LuckPerms/ранг), чтобы:
# видеть варнинги, пользоваться /cheking /unchecking /spec /unspec /tp /to /reports /v,
# видеть немодерированный чат и видеть игроков в ванише.
alert-permission: "megaac.staff"

checks:
  killaura:
    enabled: true
    max-cps: 14              # обычный игрок редко стабильно бьёт быстрее ~10-12 раз/сек без автокликера
    max-angle-diff: 55.0     # запас на резкие повороты мыши у обычных игроков; меньше -> строже
    multi-aura-window-ms: 200
  reach:
    enabled: true
    max-distance: 3.05       # ванильный лимит ~3.0-3.02, небольшой запас на пинг/лаги
  xray:
    enabled: true
    suspicion-threshold: 5   # 5 "слепых" добыч ценной руды подряд за окно -> алерт
    ore-window-minutes: 15
    watched-ores:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - ANCIENT_DEBRIS
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE

chat:
  bad-words:
    - "бля"
    - "хуй"
    - "пизд"
    - "ебат"
    - "сука"
    - "мраз"
  censor-symbol: "*"

checking:
  title: "&c&lПРОВЕРКА НА ЧИТЫ"
  subtitle: "&7Свяжитесь с модератором"
  instructions:
    - "&eВы вызваны на проверку античитом."
    - "&eНапишите в чат ваш контакт для связи (Discord или AnyDesk ID)."
    - "&eВаши сообщения видит только модератор, который вас вызвал."

messages:
  prefix: "&8[&cMegaAC&8] &r"
